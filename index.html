<!DOCTYPE html>
<html>

<head>
    <title>Map with Drawing</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <!-- Leaflet Draw CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="controls">
        <button class="btn" onclick="getLocation()">📍 Location</button>
        <button class="btn" onclick="drawLine()">➖ Line</button>
        <button class="btn" onclick="drawPolygon()">⬛ Polygon</button>
        <button class="btn" onclick="undoLast()">↩ Undo</button>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- Leaflet Draw JS -->
    <script src="https://unpkg.com/leaflet-draw/dist/leaflet.draw.js"></script>

    <!-- Custom JS -->
    <script src="script.js"></script>

</body>

</html>
